<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Simon - Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
</head>
<body>
    <div class="game-page">
        <div class="game-card">
            <h1>SUPER SIMON</h1>

            <div class="stats">
                <div class="stat">⏱️ <span id="timer">0</span><small>זמן</small></div>
                <div class="stat">🧠 <span id="level">0</span><small>שלב</small></div>
                <div class="stat">⭐ <span id="score">0</span><small>קודים</small></div>
                <div class="stat">🔁 <span id="ch">0</span><small>ניסיונות</small></div>
            </div>

            <div class="message"></div>

            <div id="board"></div>

            <div class="controls">
                <button id="sound">🔊</button>
                <button id="home">🏠</button>
                <button id="playing">⏸️</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
