<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<a href="index.html">עמוד</a>
  
    <title>game</title>

</head>
<body>
    <div class="game-page">
    
        <div class="game-card">
            <h1>SUPER SIMON</h1>
    
            <div class="stats">
                <div class="stat">⏱️ <span id="taimer"></span><small>זמן</small></div>
                <div class="stat">🧠 <span id="level"></span><small>שלב</small></div>
                <div class="stat">⭐ <span id="score"></span><small>קודים</small></div>
                <div class="stat">🔁 <span id="ch"></span><small>ניסיונות</small></div>
            </div>
    
            <div class="message"></div>
    
            <div id="board"></div>
    
            <div class="controls">
                <button id="sound">🔊</button>
                <button id="home">🏠</button>
                <button id="playing">⏸️</button>
            </div>
        </div>

</body>
</html>
