<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<a href="index.html">עמוד</a>
  
    <title>game</title>

</head>

<body>
    <div id="home-screen" class="home-screen" style="display: none;">
        <div class="home-card home-record-card">
            <div class="home-card-header">
                <div>
                    <span class="home-badge">🏠</span>
                    <h2>מצב משחק</h2>
                </div>
                <button id="back-to-game" class="close-btn">חזרה למשחק</button>
            </div>

            <p class="home-summary">כאן ניתן לראות את ההתקדמות שלך בזמן המשחק.</p>

            <div class="home-stats">
                <div class="home-stat-box">
                    <span>שם שחקן</span>
                    <strong id="player-display">-</strong>
                </div>
                <div class="home-stat-box">
                    <span>שלב נוכחי</span>
                    <strong class="record-level">0</strong>
                </div>
                <div class="home-stat-box">
                    <span>ניקוד</span>
                    <strong class="record-score">0</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="game-page">
        <div class="game-card">
            <h1>SUPER SIMON</h1>
    
            <div class="stats">
                <div class="stat">⏱️ <span id="taimer"></span><small>זמן</small></div>
                <div class="stat">🧠 <span id="level"></span><small>שלב</small></div>
                <div class="stat">⭐ <span id="score"></span><small>קודים</small></div>
                <div class="stat">🔁 <span id="ch"></span><small>ניסיונות</small></div>
            </div>

            <div class="message"></div>
    
            <div id="board"></div>

            <div class="controls">
                <button id="sound">🔊</button>
                <button id="home">🏠</button>
                <button id="playing">⏸️</button>
            </div>
        </div>
    </div>

</body>

</html>
